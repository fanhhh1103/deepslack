name: Release Desktop Installers (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, test & build frontend
        run: npm run typecheck && npm test && npm run build

      - name: Run Rust tests
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: src-tauri
        run: cargo test

      - name: Install Tauri v2 CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build and upload Tauri release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DeepSlack v__VERSION__ · 深度摸鱼（烧币版）'
          releaseBody: |
            ## 🐳 DeepSlack v__VERSION__ · 深度摸鱼（烧币版）

            **Turn your daily Claude Code / Codex / Antigravity token burn into a living anime desktop pet (macOS & Windows).**

            ### ✨ What's New in v__VERSION__ / 本版更新亮点
            - **🎀 全员 5 位 AI 娘升级 39 帧全动作套件（195 张贴图）**：大橘 (Claude)、白龙 (ChatGPT)、星猫 (Gemini)、Grok 娘与大肥鱼 (DeepSeek) 全面同规格，支持 4 帧步态走路、4 帧机械键盘猛敲、双帧红温冒烟、4 帧听歌、4 帧干饭、3 段式重锤拍 Bug、柔和坐姿过渡及独立摸头/开心表情。
            - **🎭 专属梗道具与人设台词**：大橘（小橘蟹 + 橘子蛋糕 + 雏菊印章锤）、白龙（水晶键盘 + 云朵看书 + 草莓芭菲 + 冰晶锤）、星猫（彩虹键盘 + 星星香蕉玩偶 + 鲷鱼烧 + 星形锤）、Grok 娘（黑红哥特键盘 + 掌机 + 大汉堡 + 战锤），全员配齐专属抓包/红温/互动台词。
            - **All 5 AI Girl Pets Now Feature Full 39-Sprite Animation Suites (195 Sprites Total)**: Daju (Claude), Bailong (ChatGPT), Xingmao (Gemini), Grok-chan (Grok), and Dafeiyu (DeepSeek) now all share silky 4-frame walk/work/music/eat cycles, 3-stage bug bonk, dual-frame overheat, signature props, and in-character voice lines.

            ### ⬇️ Direct Downloads / 一键直链下载
            | Platform / 平台 | Direct Download / 直链下载 | Notes / 说明 |
            | :--- | :--- | :--- |
            | **macOS (Apple Silicon M1–M4)** | **[DeepSlack___VERSION___aarch64.dmg](https://github.com/fanhhh1103/deepslack/releases/download/v__VERSION__/DeepSlack___VERSION___aarch64.dmg)** | Recommended for M-series Macs / M 系列芯片首选 |
            | **macOS (Intel)** | **[DeepSlack___VERSION___x64.dmg](https://github.com/fanhhh1103/deepslack/releases/download/v__VERSION__/DeepSlack___VERSION___x64.dmg)** | For Intel Macs / Intel 芯片 Mac |
            | **Windows 10/11 (x64 · Recommended)** | **[DeepSlack___VERSION___x64-setup.exe](https://github.com/fanhhh1103/deepslack/releases/download/v__VERSION__/DeepSlack___VERSION___x64-setup.exe)** | Per-user installer, no admin UAC required / 推荐，免管理员安装 |
            | **Windows 10/11 (x64 · MSI)** | **[DeepSlack___VERSION___x64_en-US.msi](https://github.com/fanhhh1103/deepslack/releases/download/v__VERSION__/DeepSlack___VERSION___x64_en-US.msi)** | Standard Windows MSI package / 标准 MSI 安装包 |

            - **🌐 3-Second Web Demo / 网页 3 秒免安装试玩**: https://fanhhh1103.github.io/deepslack/

            ### 💡 First Launch Notice (Unsigned Builds / 首次打开提示)
            - **macOS**: If macOS says the app is damaged or from an unidentified developer, drag `DeepSlack.app` to Applications and run once:
              ```bash
              xattr -cr /Applications/DeepSlack.app
              ```
            - **Windows**: Click **"More info" → "Run anyway"**（点击 **「更多信息」→「仍要运行」**）if Windows SmartScreen prompts on first launch.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
